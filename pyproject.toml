[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asta"
dynamic = ["version"]
description = "O primeiro super app open source: chat com qualquer modelo de IA, busca na web, mundos 3D com NPCs-agentes, avatars de chat e voz, jogos 2D e um Canvas de imagens, vídeos, sons e vozes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KMC" }]
keywords = ["ai", "agents", "worlds", "three.js", "roleplay", "avatars", "chatbot", "game", "2d-games", "visual-novel", "canvas", "image-generation", "video-editor", "webui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
]
# Zero dependências obrigatórias: o núcleo usa apenas a biblioteca padrão do Python.
dependencies = []

[project.optional-dependencies]
# Modelos locais rodando dentro do próprio ASTA (GGUF baixado do Hugging Face)
# Modelos GGUF embutidos: texto (llama.cpp) e imagem/vídeo (stable-diffusion.cpp)
local = ["llama-cpp-python>=0.2.90", "stable-diffusion-cpp-python"]
# Extração de texto de PDFs mais precisa
docs = ["pypdf>=4.0"]
# Modelos locais do Hugging Face para o Canvas (imagem, vídeo, som, voz e transcrição)
media = ["torch", "torchvision", "diffusers>=0.30", "transformers>=4.44", "accelerate", "safetensors", "sentencepiece", "numpy", "pillow"]
# Tudo de uma vez (é o que os instaladores e o `asta update` usam por padrão)
all = ["pypdf>=4.0", "torch", "torchvision", "diffusers>=0.30", "transformers>=4.44", "accelerate", "safetensors", "sentencepiece", "numpy", "pillow", "llama-cpp-python>=0.2.90", "stable-diffusion-cpp-python"]

[project.urls]
Homepage = "https://github.com/KMC1525/ASTA"
Issues = "https://github.com/KMC1525/ASTA/issues"

[project.scripts]
asta = "asta.cli:main"

[tool.setuptools.packages.find]
include = ["asta*"]

[tool.setuptools.package-data]
asta = ["web/**/*", "runtime/**/*", "runtime2d/**/*", "native/Cargo.toml", "native/Cargo.lock", "native/src/*.rs"]

[tool.setuptools.dynamic]
version = { attr = "asta.__version__" }
