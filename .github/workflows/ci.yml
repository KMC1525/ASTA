name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Núcleo Rust (testes e compilação — parte obrigatória do ASTA)
        shell: bash
        run: |
          cargo test --release --manifest-path asta/native/Cargo.toml
          cargo build --release --manifest-path asta/native/Cargo.toml
          case "$RUNNER_OS" in Windows) L=asta_core.dll ;; macOS) L=libasta_core.dylib ;; *) L=libasta_core.so ;; esac
          echo "ASTA_NATIVE_LIB=$PWD/asta/native/target/release/$L" >> "$GITHUB_ENV"
      - name: Instalar
        run: python -m pip install -e .
      - name: Testes
        run: python -m unittest discover -s tests -t . -v

  browser:
    name: Navegador, Canvas e vídeo (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Playwright e Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Instalar
        run: python -m pip install -e .
      - name: Testes de navegador, Canvas e jogos 2D
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: python -m unittest tests.test_browser tests.test_canvas tests.test_games2d -v

  installer:
    name: Instalador (Linux)
    runs-on: ubuntu-latest
    env:
      ASTA_MODELS: none  # nada de baixar vários GB de modelos no CI
      ASTA_PYTHON: keep  # o Python do runner é gerenciado pelo GitHub; o teste do instalador não deve trocá-lo
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe do install.sh e dos instaladores
        run: |
          sh -n install.sh
          bash --posix -n install.sh
          sh -n installers/linux/build-appimage.sh
          sh -n installers/linux/AppRun
          bash -n installers/macos/build-pkg.sh
          bash -n installers/macos/launcher.sh
          python3 -m py_compile installers/release_notes.py installers/windows/make_ico.py mobile-app/android-overlay/patch_android.py mobile-app/android-overlay/python/asta_android.py
      - name: Instalar a partir desta pasta e reinstalar (atualização), com uma biblioteca opcional leve
        run: |
          ASTA_SOURCE="$PWD" ASTA_EXTRAS=docs sh install.sh
          ASTA_SOURCE="$PWD" ASTA_EXTRAS=docs sh install.sh
          "$HOME/.local/bin/asta" version
          "$HOME/.asta/app/venv/bin/python" -c "import pypdf"
      - name: Instalar só o ASTA (sem bibliotecas opcionais)
        run: ASTA_SOURCE="$PWD" ASTA_EXTRAS=none ASTA_APP_DIR="$RUNNER_TEMP/core" ASTA_BIN_DIR="$RUNNER_TEMP/corebin" sh install.sh
