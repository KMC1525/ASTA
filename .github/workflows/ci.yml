name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        run: python -m pip install -e .
      - name: Testes
        run: python -m unittest discover -s tests -t . -v

  installer:
    name: Instalador (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe do install.sh
        run: sh -n install.sh
      - name: Instalar a partir desta pasta e reinstalar (atualização)
        run: |
          ASTA_SOURCE="$PWD" sh install.sh
          ASTA_SOURCE="$PWD" sh install.sh
          "$HOME/.local/bin/asta" version
