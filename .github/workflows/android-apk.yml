# Gera o APK do app mobile do ASTA (casca Capacitor em mobile-app/) e o anexa à Release: quem não tem computador por perto baixa o APK pelo QR code do repositório
# (https://github.com/KMC1525/ASTA/releases/latest) e o próprio app avisa quando sai versão nova.
name: android-apk
on:
  push:
    branches: [main]
    paths: ["asta/__init__.py", "mobile-app/**", ".github/workflows/android-apk.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Versão do app = versão do ASTA
        id: ver
        working-directory: .
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"',open('asta/__init__.py').read()).group(1))")
          sed -i "s/\"version\": \".*\"/\"version\": \"$V\"/" mobile-app/package.json
          echo "v=$V" >> "$GITHUB_OUTPUT"
          sed -i "s/var APP_VERSION = '.*';/var APP_VERSION = '$V';/" mobile-app/www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Permissões (câmera para o QR) e HTTP na rede local
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application android:usesCleartextTraffic="true"#' "$M"
      - run: npx cap sync android
      - name: Compilar o APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nome do arquivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../ASTA-mobile.apk
      - uses: actions/upload-artifact@v4
        with: { name: ASTA-mobile-apk, path: ASTA-mobile.apk }
      - name: Publicar a Release (cria vX.Y.Z se ainda não existe) com o APK
        working-directory: .
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="v${{ steps.ver.outputs.v }}"
          if [ "${{ github.event_name }}" = "release" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ASTA-mobile.apk --clobber
          else
            gh release create "$TAG" ASTA-mobile.apk --target "${{ github.sha }}" --title "ASTA $TAG" --latest \
              --notes "App Android do ASTA (APK). Baixe, permita instalar apps desconhecidos uma vez, abra e escaneie o QR code de pareamento do seu ASTA (asta mobile). / Android app (APK): download, allow unknown apps once, open it and scan your ASTA pairing QR code (asta mobile). Changelog: CHANGELOG.md"
          fi
